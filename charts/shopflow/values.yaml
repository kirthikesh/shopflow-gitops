# Defaults shared by every environment. envs/<env>/values.yaml overrides them.

environment: dev

image:
  registry: acrshopflow0q6q39.azurecr.io
  # Set per environment by the app pipeline: the commit it built and scanned.
  tag: ""

# Load balancer in front of the frontend. internal: true gives it a private IP
# in the VNet instead of a public one.
publicEndpoint:
  enabled: true
  internal: false

# Sized so dev, prod and Argo CD share one 2-vCPU node, where AKS's own system
# pods already reserve about 70% of the CPU. Requests are only what the
# scheduler sets aside; with no CPU limits a pod still bursts into idle CPU.
# Memory requests stay realistic: memory is plentiful and can't be borrowed.
workloads:
  product-service:
    resources:
      requests: { cpu: 10m, memory: 128Mi }
      limits: { memory: 256Mi }
  cart-service:
    resources:
      requests: { cpu: 10m, memory: 96Mi }
      limits: { memory: 256Mi }
  order-service:
    resources:
      requests: { cpu: 25m, memory: 384Mi }
      limits: { memory: 768Mi }
  payment-service:
    resources:
      requests: { cpu: 5m, memory: 32Mi }
      limits: { memory: 128Mi }
  notification-service:
    resources:
      requests: { cpu: 5m, memory: 64Mi }
      limits: { memory: 192Mi }
  frontend:
    resources:
      requests: { cpu: 10m, memory: 128Mi }
      limits: { memory: 384Mi }
  postgres:
    resources:
      requests: { cpu: 20m, memory: 256Mi }
      limits: { memory: 512Mi }
  redis:
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { memory: 256Mi }
  mailpit:
    resources:
      requests: { cpu: 5m, memory: 32Mi }
      limits: { memory: 128Mi }

# Replace pods one at a time: stop the old pod, then start the new one. Needs
# no spare node capacity during a rollout; costs a few seconds per service.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1
