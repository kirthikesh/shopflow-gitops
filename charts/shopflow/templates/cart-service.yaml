apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-service
  labels: { environment: {{ .Values.environment | quote }}, app: cart-service, part-of: shopflow }
spec:
  replicas: {{ (index .Values.workloads "cart-service").replicas | default 1 }}
  strategy:
    {{- toYaml .Values.updateStrategy | nindent 4 }}
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app: cart-service }
  template:
    metadata:
      labels: { environment: {{ .Values.environment | quote }}, app: cart-service, part-of: shopflow }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: cart-service
          image: {{ include "shopflow.image" (list . "cart-service") }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: REDIS_URL
              value: "redis://redis:6379/0"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
          resources:
            {{- toYaml (index .Values.workloads "cart-service").resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: cart-service
  labels: { environment: {{ .Values.environment | quote }}, app: cart-service, part-of: shopflow }
spec:
  selector: { app: cart-service }
  ports:
    - name: http
      port: 8000
      targetPort: http
