apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  labels: { environment: {{ .Values.environment | quote }}, app: payment-service, part-of: shopflow }
spec:
  replicas: {{ (index .Values.workloads "payment-service").replicas | default 1 }}
  strategy:
    {{- toYaml .Values.updateStrategy | nindent 4 }}
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app: payment-service }
  template:
    metadata:
      labels: { environment: {{ .Values.environment | quote }}, app: payment-service, part-of: shopflow }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: payment-service
          image: {{ include "shopflow.image" (list . "payment-service") }}
          ports:
            - name: http
              containerPort: 8083
          env:
            - name: SERVICEBUS_CONNECTION_STRING
              valueFrom:
                secretKeyRef: { name: shopflow-secrets, key: SERVICEBUS_CONNECTION_STRING }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
          resources:
            {{- toYaml (index .Values.workloads "payment-service").resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  labels: { environment: {{ .Values.environment | quote }}, app: payment-service, part-of: shopflow }
spec:
  selector: { app: payment-service }
  ports:
    - name: http
      port: 8083
      targetPort: http
